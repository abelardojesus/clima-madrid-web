<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Clima Madrid</title>
<link rel="stylesheet" href="/style.css" />
</head>
<body>
  <main class="page">
    <header class="header">
      <h1 id="greeting">Cargando…</h1>
      <p id="datetime" class="muted"></p>
    </header>

    <div id="last-updated" class="update-badge">🕒 Actualizando…</div>

    <section id="weather-card" class="card weather-card">
      <p class="muted">Cargando el clima de Madrid…</p>
    </section>

    <section id="recommendation" class="card recommendation-card" hidden></section>

    <section id="news" class="news-grid"></section>
  </main>

  <script src="/script.js"></script>
</body>
</html>
